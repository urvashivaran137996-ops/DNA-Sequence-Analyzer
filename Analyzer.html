<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🧬 DNA Sequence Analyzer</h1>
    <p>Analyze Your DNA Sequence</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="analyzer.html">Analyzer</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
    <section class="analyzer">
        <h2>DNA Analyzer</h2>

        <p>Enter a DNA sequence using A, T, G and C.</p>

        <textarea
            id="dnaInput"
            placeholder="Example: ATGCGATTA">
        </textarea>

        <div class="buttons">
            <button onclick="analyzeDNA()">Analyze</button>
            <button onclick="clearDNA()" class="clear">Clear</button>
            <button onclick="copyResult()" class="copy">Copy Result</button>
        </div>

        <div id="error"></div>

        <div id="result" class="result">
            <p>Enter a DNA sequence and click Analyze.</p>
        </div>
    </section>
</main>

<footer>
    <p>© 2026 DNA Sequence Analyzer</p>
</footer>

<script src="script.js"></script>

</body>
</html>
