<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            🧬 DNA Analyzer

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#nav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="nav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="analyzer.html">
                        Analyzer
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="how-it-works.html">
                        How It Works
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<section class="section-padding">

    <div class="container">

        <div class="section-title">

            <h1>Contact Us</h1>

            <p>
                Have a question about the project?
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="contact-card">

                    <form onsubmit="showMessage(event)">

                        <div class="mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required
                                   placeholder="Enter your name">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   required
                                   placeholder="Enter your email">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Message
                            </label>

                            <textarea
                                class="form-control"
                                rows="5"
                                required
                                placeholder="Enter your message">
                            </textarea>

                        </div>


                        <button type="submit"
                                class="btn btn-primary">

                            Send Message

                        </button>


                        <div id="message"
                             class="alert alert-success mt-3 d-none">

                            Thank you! Your message has been
                            submitted successfully.

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>


<footer class="footer">

    <p class="mb-0">
        © 2026 DNA Sequencing Analyzer
    </p>

</footer>


<script>

function showMessage(event) {

    event.preventDefault();

    document
        .getElementById("message")
        .classList.remove("d-none");

}

</script>


</body>
</html>
